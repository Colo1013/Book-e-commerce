# ===================================================================
# CONFIGURAZIONE DATABASE H2 PERSISTENTE SU FILE
# ===================================================================
# Invece di usare 'jdbc:h2:mem:...' (che vive in RAM e si cancella allo spegnimento),
# usiamo 'jdbc:h2:file:./data/bookstore_db' per salvare tutti i dati su disco!
# AUTO_SERVER=TRUE permette di collegarsi al DB anche mentre l'app è in esecuzione.
spring.datasource.url=jdbc:h2:file:./data/bookstore_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# CONFIGURAZIONE JPA / HIBERNATE
# ===================================================================
# 'update' mantiene i dati esistenti tra un riavvio e l'altro:
# se le tabelle non esistono le crea, se esistono già le conserva senza cancellarle!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===================================================================
# CONSOLE WEB GRAFICA DI H2 (Accessibile da browser: http://localhost:8080/h2-console)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
