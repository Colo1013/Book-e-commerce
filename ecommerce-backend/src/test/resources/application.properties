# ===================================================================
# CONFIGURAZIONE ISOLATA PER I TEST AUTOMATICI (mvn test)
# ===================================================================
# Durante i test JUnit usiamo un DB in-memory separato ('mem:testdb') con 'create-drop',
# così i test non toccano né cancellano mai il file vero './data/bookstore_db'!
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
